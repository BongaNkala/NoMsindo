{% extends "base.html" %}{% block title %}Start free trial{% endblock %}
{% block auth %}<div class="card"><h2>Start your free {{ config.TRIAL_DAYS }}-day trial</h2>
<p class="muted">{{ config.TRIAL_SEATS }} seats included. No card needed.</p>
{% if error %}<div class="flash err">{{ error }}</div>{% endif %}
<form method="post" action="/signup"><input type="hidden" name="csrf" value="{{ csrf }}">
<label>Organisation name</label><input name="org_name" value="{{ org_name or '' }}" required autofocus>
<label>Your work email</label><input name="email" type="email" value="{{ email or '' }}" required>
<label>Password (10+ characters)</label><input name="password" type="password" minlength="10" required>
<p><button type="submit">Create account</button></p></form>
<p class="muted">Already have an account? <a href="/login">Sign in</a></p></div>{% endblock %}
